<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0B0F17"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#vx-grad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Voice Waveform bars -->
  <g fill="url(#vx-grad)" filter="url(#glow)">
    <rect x="14" y="24" width="4" height="16" rx="2"/>
    <rect x="22" y="16" width="4" height="32" rx="2"/>
    <rect x="30" y="10" width="4" height="44" rx="2"/>
    <rect x="38" y="18" width="4" height="28" rx="2"/>
    <rect x="46" y="26" width="4" height="12" rx="2"/>
  </g>
</svg>
