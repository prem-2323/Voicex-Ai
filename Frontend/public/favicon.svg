<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vx-gradient" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="0.75" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="vx-wave" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <radialGradient id="vx-glow" cx="32" cy="32" r="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark glass tile -->
  <rect width="64" height="64" rx="16" fill="#0B0F17"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="14.75" fill="url(#vx-gradient)" fill-opacity="0.16" stroke="url(#vx-gradient)" stroke-width="1.5"/>

  <!-- Soft inner glow and top-left sheen -->
  <circle cx="32" cy="32" r="26" fill="url(#vx-glow)"/>
  <ellipse cx="20" cy="14" rx="22" ry="11" transform="rotate(-18 20 14)" fill="#FFFFFF" fill-opacity="0.06"/>

  <!-- Voice waveform -->
  <g fill="url(#vx-wave)">
    <rect x="13.25" y="26" width="4.5" height="12" rx="2.25"/>
    <rect x="21.5" y="19" width="4.5" height="26" rx="2.25"/>
    <rect x="29.75" y="11" width="4.5" height="42" rx="2.25"/>
    <rect x="38" y="18" width="4.5" height="28" rx="2.25"/>
    <rect x="46.25" y="25" width="4.5" height="14" rx="2.25"/>
  </g>

  <!-- Live listening accent -->
  <circle cx="47.5" cy="16.5" r="2.25" fill="#22D3EE" fill-opacity="0.9"/>
</svg>
